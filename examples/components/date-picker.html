<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Date Picker — WCAG 2.2 AA</title>
  <style>
    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; }

    /* ── Date picker wrapper ── */
    .datepicker-wrapper { position: relative; display: inline-block; }

    /* ── Input + button ── */
    .datepicker-input-group { display: flex; gap: 0; }
    .datepicker-input {
      padding: .5rem .75rem; border: 2px solid #6b7280;
      border-radius: 6px 0 0 6px; font-size: 1rem; width: 12rem;
    }
    .datepicker-input:focus {
      outline: 3px solid #1d4ed8; outline-offset: 2px; border-color: #1d4ed8;
    }
    .datepicker-toggle {
      padding: .5rem .75rem; background: #1d4ed8; color: #fff;
      border: 2px solid #1d4ed8; border-radius: 0 6px 6px 0;
      cursor: pointer; font-size: 1rem; min-width: 44px; min-height: 44px;
    }
    .datepicker-toggle:focus-visible {
      outline: 3px solid #1d4ed8; outline-offset: 3px;
    }
    .datepicker-toggle:hover { background: #1e40af; }

    /* ── Calendar dialog ── */
    .datepicker-dialog {
      position: absolute; top: calc(100% + 4px); left: 0;
      background: #fff; border: 2px solid #6b7280; border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,.15); z-index: 100; min-width: 280px;
    }
    .datepicker-dialog[hidden] { display: none; }

    /* ── Month navigation ── */
    .datepicker-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1rem; border-bottom: 1px solid #e5e7eb;
    }
    .datepicker-nav-btn {
      background: none; border: 2px solid transparent; border-radius: 6px;
      cursor: pointer; padding: .25rem .5rem; font-size: 1.2rem;
      min-width: 36px; min-height: 36px; color: #374151;
    }
    .datepicker-nav-btn:hover { background: #f3f4f6; border-color: #d1d5db; }
    .datepicker-nav-btn:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    .datepicker-month-label { font-weight: 600; font-size: 1rem; }

    /* ── Day-of-week headers ── */
    .datepicker-grid { padding: .5rem 1rem 1rem; }
    .datepicker-days { border-collapse: separate; border-spacing: 2px; }
    .datepicker-weekday { font-size: .75rem; font-weight: 400; color: #4b5563; padding: .25rem; text-align: center; }

    /* ── Day cells (gridcell is the focus target) ── */
    .datepicker-day {
      border: 2px solid transparent; border-radius: 6px;
      padding: .4rem; text-align: center; cursor: pointer; font-size: .9rem;
      min-width: 36px; min-height: 36px; color: #111827;
    }
    .datepicker-day:hover { background: #dbeafe; }
    .datepicker-day:focus { outline: 3px solid #1d4ed8; outline-offset: 1px; }
    .datepicker-day[aria-selected="true"] {
      background: #1d4ed8; color: #fff; border-color: #1d4ed8;
    }
    .datepicker-day[aria-current="date"] { border-color: #1d4ed8; font-weight: 700; }
    .datepicker-empty { cursor: default; }
    .datepicker-empty:hover { background: none; }
    .datepicker-footer { display: flex; justify-content: flex-end; margin-top: .5rem; }
    .datepicker-cancel { border-color: #6b7280; padding: .25rem .75rem; font-size: .9rem; }

    /* ── Status / error ── */
    .datepicker-status { margin-top: .5rem; font-size: .875rem; color: #dc2626; }
  </style>
</head>
<body>

<h1>Accessible Date Picker</h1>
<p>WCAG 2.1/2.2 AA compliant. Keyboard: Arrow keys navigate, Enter/Space select, Escape closes, Page Up/Down change months, Home/End go to first/last of week.</p>

<div class="datepicker-wrapper" id="dp-wrapper">

  <!-- Visible text input (also accepts typed dates) -->
  <div class="datepicker-input-group">
    <label for="dp-input" class="sr-only">Select date (MM/DD/YYYY)</label>
    <input
      id="dp-input"
      class="datepicker-input"
      type="text"
      placeholder="MM/DD/YYYY"
      autocomplete="off"
      aria-describedby="dp-hint"
    >
    <button
      id="dp-toggle"
      class="datepicker-toggle"
      type="button"
      aria-label="Open date picker"
      aria-haspopup="dialog"
      aria-expanded="false"
      aria-controls="dp-dialog"
    >
      📅
    </button>
  </div>

  <!-- Error / status (screen reader live region) -->
  <div id="dp-hint" class="sr-only">Format MM/DD/YYYY. Down arrow opens the calendar.</div>
  <div id="dp-status" class="datepicker-status" role="alert"></div>

  <!-- Calendar dialog -->
  <div
    id="dp-dialog"
    class="datepicker-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dp-month-label"
    tabindex="-1"
    hidden
  >
    <!-- Month navigation -->
    <div class="datepicker-header">
      <button
        id="dp-prev-year"
        class="datepicker-nav-btn"
        type="button"
        aria-label="Previous year"
      >«</button>
      <button
        id="dp-prev-month"
        class="datepicker-nav-btn"
        type="button"
        aria-label="Previous month"
      >‹</button>
      <span
        id="dp-month-label"
        class="datepicker-month-label"
        aria-live="polite"
        aria-atomic="true"
      ></span>
      <button
        id="dp-next-month"
        class="datepicker-nav-btn"
        type="button"
        aria-label="Next month"
      >›</button>
      <button
        id="dp-next-year"
        class="datepicker-nav-btn"
        type="button"
        aria-label="Next year"
      >»</button>
    </div>

    <!-- APG Date Picker Dialog structure: table role="grid" > rows > gridcells; the focused gridcell
         itself is the tab stop (roving tabindex), there are no buttons inside the grid. -->
    <div class="datepicker-grid">
      <table id="dp-grid" class="datepicker-days" role="grid" aria-labelledby="dp-month-label">
        <thead>
          <tr>
            <th scope="col" abbr="Sunday" class="datepicker-weekday">Su</th>
            <th scope="col" abbr="Monday" class="datepicker-weekday">Mo</th>
            <th scope="col" abbr="Tuesday" class="datepicker-weekday">Tu</th>
            <th scope="col" abbr="Wednesday" class="datepicker-weekday">We</th>
            <th scope="col" abbr="Thursday" class="datepicker-weekday">Th</th>
            <th scope="col" abbr="Friday" class="datepicker-weekday">Fr</th>
            <th scope="col" abbr="Saturday" class="datepicker-weekday">Sa</th>
          </tr>
        </thead>
        <tbody id="dp-body"><!-- rows and cells generated by JS --></tbody>
      </table>
      <div class="datepicker-footer">
        <button id="dp-cancel" class="datepicker-nav-btn datepicker-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>
</div>

<style>
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>

<script>
(function () {
  'use strict';

  /* ── State ── */
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();       // 0-indexed
  let selectedDate = null;               // Date | null
  let focusedDate = new Date(today);
  let isOpen = false;

  /* ── Elements ── */
  const input       = document.getElementById('dp-input');
  const toggleBtn   = document.getElementById('dp-toggle');
  const dialog      = document.getElementById('dp-dialog');
  const body        = document.getElementById('dp-body');
  const cancelBtn   = document.getElementById('dp-cancel');
  const monthLabel  = document.getElementById('dp-month-label');
  const statusEl    = document.getElementById('dp-status');
  const prevYear    = document.getElementById('dp-prev-year');
  const prevMonth   = document.getElementById('dp-prev-month');
  const nextMonth   = document.getElementById('dp-next-month');
  const nextYear    = document.getElementById('dp-next-year');

  const MONTHS = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];
  const DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* ── Helpers ── */
  function sameDay(a, b) {
    return a && b &&
      a.getFullYear() === b.getFullYear() &&
      a.getMonth()    === b.getMonth()    &&
      a.getDate()     === b.getDate();
  }
  function toInputString(date) {
    if (!date) return '';
    const m = String(date.getMonth() + 1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    return `${m}/${d}/${date.getFullYear()}`;
  }
  function parseInput(str) {
    const match = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!match) return null;
    const date = new Date(+match[3], +match[1]-1, +match[2]);
    return isNaN(date) ? null : date;
  }

  /* ── Open / close ── */
  function openDialog() {
    focusedDate = selectedDate ? new Date(selectedDate) : new Date(today);
    viewYear  = focusedDate.getFullYear();
    viewMonth = focusedDate.getMonth();
    renderGrid();
    dialog.removeAttribute('hidden');
    toggleBtn.setAttribute('aria-expanded', 'true');
    isOpen = true;
    focusCurrent(); // focus the cell for the focused date
  }

  function closeDialog(returnFocus = true) {
    dialog.setAttribute('hidden', '');
    toggleBtn.setAttribute('aria-expanded', 'false');
    isOpen = false;
    if (returnFocus) toggleBtn.focus();
  }

  /* ── Render ── */
  function renderGrid() {
    monthLabel.textContent = `${MONTHS[viewMonth]} ${viewYear}`;

    const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    body.innerHTML = '';
    let row = null;
    const cells = firstDay + daysInMonth;
    const total = Math.ceil(cells / 7) * 7;
    for (let i = 0; i < total; i++) {
      if (i % 7 === 0) { row = document.createElement('tr'); body.appendChild(row); }
      const d = i - firstDay + 1;
      row.appendChild(makeCell(d >= 1 && d <= daysInMonth ? new Date(viewYear, viewMonth, d) : null));
    }
  }

  function makeCell(date) {
    const td = document.createElement('td');
    td.setAttribute('role', 'gridcell');
    if (!date) { td.className = 'datepicker-empty'; return td; } // days of other months are left blank

    td.className = 'datepicker-day';
    td.textContent = date.getDate();
    td.dataset.date = String(date.getTime());

    // Accessible name: "15 Wednesday January 2026"
    td.setAttribute('aria-label',
      `${date.getDate()} ${DAYS_LONG[date.getDay()]} ${MONTHS[date.getMonth()]} ${date.getFullYear()}`
    );

    if (sameDay(date, today)) td.setAttribute('aria-current', 'date');
    if (sameDay(date, selectedDate)) td.setAttribute('aria-selected', 'true'); // aria-selected belongs on the gridcell

    // Roving tabindex: only the focused date is a tab stop
    td.setAttribute('tabindex', sameDay(date, focusedDate) ? '0' : '-1');

    td.addEventListener('click', () => selectDate(date));
    return td;
  }

  function selectDate(date) {
    selectedDate = date;
    input.value = toInputString(date);
    statusEl.textContent = '';
    closeDialog();
  }

  // Move the month by n, keeping the day number (clamped), without moving focus
  // (used by the month/year buttons, which keep focus on themselves).
  function shiftMonths(n) {
    const target = new Date(viewYear, viewMonth + n, 1);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    focusedDate = new Date(target.getFullYear(), target.getMonth(), Math.min(focusedDate.getDate(), last));
    viewYear = target.getFullYear();
    viewMonth = target.getMonth();
    renderGrid();
  }

  /* ── Keyboard navigation (inside the grid) ── */
  body.addEventListener('keydown', e => {
    const key = e.key;
    let delta = 0;

    if (key === 'ArrowRight')  delta = 1;
    else if (key === 'ArrowLeft')  delta = -1;
    else if (key === 'ArrowDown')  delta = 7;
    else if (key === 'ArrowUp')    delta = -7;
    else if (key === 'Home') delta = -(focusedDate.getDay());      // start of week
    else if (key === 'End')  delta = 6 - focusedDate.getDay();     // end of week
    else if (key === 'PageDown' || key === 'PageUp') {
      e.preventDefault();
      shiftMonths(key === 'PageDown' ? 1 : -1);
      focusCurrent();
      return;
    } else if (key === 'Enter' || key === ' ') {
      e.preventDefault();
      selectDate(new Date(focusedDate));
      return;
    } else return; // Tab and Escape are handled on the dialog

    e.preventDefault();
    focusedDate = new Date(focusedDate.getFullYear(), focusedDate.getMonth(), focusedDate.getDate() + delta);
    viewYear  = focusedDate.getFullYear();
    viewMonth = focusedDate.getMonth();
    renderGrid();
    focusCurrent();
  });

  function focusCurrent() {
    const focused = body.querySelector('[tabindex="0"]');
    if (focused) focused.focus();
  }

  /* ── Dialog: Tab stays inside (aria-modal), Escape closes and returns focus ── */
  dialog.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeDialog();
      return;
    }
    if (e.key !== 'Tab') return;
    const tabbables = [...dialog.querySelectorAll('button, [tabindex="0"]')];
    const first = tabbables[0];
    const last = tabbables[tabbables.length - 1];
    // The dialog itself (tabindex="-1") holds focus after a click on a non-focusable part: treat it as "first"
    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  cancelBtn.addEventListener('click', () => closeDialog());

  /* ── Toggle + input events ── */
  toggleBtn.addEventListener('click', () => isOpen ? closeDialog() : openDialog());

  input.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === 'ArrowDown') && !isOpen) {
      e.preventDefault(); openDialog();
    }
  });

  input.addEventListener('change', () => {
    const parsed = parseInput(input.value);
    if (input.value && !parsed) {
      statusEl.textContent = 'Invalid date. Use MM/DD/YYYY format.';
    } else {
      statusEl.textContent = '';
      selectedDate = parsed;
    }
  });

  /* ── Nav buttons ── */
  // Focus stays on the pressed button; the month label is a polite live region and announces the change.
  prevMonth.addEventListener('click', () => shiftMonths(-1));
  nextMonth.addEventListener('click', () => shiftMonths(1));
  prevYear.addEventListener('click', () => shiftMonths(-12));
  nextYear.addEventListener('click', () => shiftMonths(12));

  /* ── Close on outside click ── */
  document.addEventListener('click', e => {
    if (isOpen && !document.getElementById('dp-wrapper').contains(e.target)) {
      closeDialog(false);
    }
  });

})();
</script>
</body>
</html>
